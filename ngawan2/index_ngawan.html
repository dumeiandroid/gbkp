<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jadwal Ngawan GBKP 2026/2027</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');

  :root {
    --bg:        #0B1120;
    --surface:   #111827;
    --surface2:  #1a2540;
    --border:    #1e3058;
    --accent:    #2563EB;
    --accent2:   #1d4ed8;
    --gold:      #F59E0B;
    --text:      #E2E8F0;
    --muted:     #64748B;
    --success:   #10B981;
    --danger:    #EF4444;
    --radius:    10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── LOGIN OVERLAY ── */
  #loginOverlay {
    position: fixed; inset: 0; z-index: 999;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }

  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 36px;
    width: 100%; max-width: 400px;
    box-shadow: 0 32px 80px rgba(0,0,0,.6);
  }

  .login-logo {
    text-align: center;
    margin-bottom: 28px;
  }

  .login-logo .cross {
    display: inline-flex;
    align-items: center; justify-content: center;
    width: 56px; height: 56px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), #7C3AED);
    font-size: 26px;
    margin-bottom: 12px;
  }

  .login-logo h2 {
    font-size: 20px; font-weight: 800;
    letter-spacing: -.3px;
  }

  .login-logo p {
    font-size: 12px; color: var(--muted); margin-top: 3px;
  }

  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 12px; font-weight: 600;
    color: var(--muted);
    text-transform: uppercase; letter-spacing: .5px;
    margin-bottom: 6px;
  }

  .field input {
    width: 100%;
    background: #0B1120;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 11px 14px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    transition: border-color .2s;
    outline: none;
  }

  .field input:focus { border-color: var(--accent); }

  .btn-login {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 15px; font-weight: 700;
    cursor: pointer;
    transition: background .2s;
    margin-top: 4px;
  }

  .btn-login:hover:not(:disabled) { background: var(--accent2); }
  .btn-login:disabled { opacity: .5; cursor: not-allowed; }

  .remember-row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 16px;
  }
  .remember-row input[type="checkbox"] {
    width: 16px; height: 16px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .remember-row label {
    font-size: 13px; color: var(--muted);
    cursor: pointer; user-select: none;
  }

  .login-err {
    margin-top: 12px;
    background: rgba(239,68,68,.1);
    border: 1px solid rgba(239,68,68,.3);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--danger);
    display: none;
    text-align: center;
  }

  /* ── MAIN APP ── */
  #app { display: none; }

  /* HEADER */
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex; align-items: center; justify-content: space-between;
    height: 60px;
    position: sticky; top: 0; z-index: 100;
  }

  .topbar-left {
    display: flex; align-items: center; gap: 12px;
  }

  .topbar-logo {
    width: 34px; height: 34px;
    background: linear-gradient(135deg, var(--accent), #7C3AED);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }

  .topbar-title { font-size: 15px; font-weight: 700; }
  .topbar-sub   { font-size: 11px; color: var(--muted); }

  .topbar-right {
    display: flex; align-items: center; gap: 10px;
  }

  .user-chip {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 14px 5px 8px;
    font-size: 13px;
  }

  .user-avatar {
    width: 26px; height: 26px;
    background: var(--accent);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700;
  }

  .btn-logout {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 12px; font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }

  .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

  /* CONTENT */
  .content { padding: 28px 24px; max-width: 1200px; margin: 0 auto; }

  /* STATS BAR */
  .stats-bar {
    display: flex; gap: 12px; flex-wrap: wrap;
    margin-bottom: 24px;
  }

  .stat-pill {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 20px;
    display: flex; align-items: center; gap: 12px;
    flex: 1; min-width: 140px;
  }

  .stat-icon {
    width: 38px; height: 38px;
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .stat-icon.blue  { background: rgba(37,99,235,.15); }
  .stat-icon.gold  { background: rgba(245,158,11,.15); }
  .stat-icon.green { background: rgba(16,185,129,.15); }

  .stat-val  { font-size: 22px; font-weight: 800; line-height: 1; }
  .stat-lbl  { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* TOOLBAR */
  .toolbar {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 16px; flex-wrap: wrap;
  }

  .search-wrap {
    flex: 1; min-width: 200px; position: relative;
  }

  .search-wrap input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 9px 14px 9px 38px;
    color: var(--text);
    font-size: 13px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    outline: none;
    transition: border-color .2s;
  }

  .search-wrap input:focus { border-color: var(--accent); }

  .search-icon {
    position: absolute; left: 12px; top: 50%;
    transform: translateY(-50%);
    color: var(--muted); font-size: 14px;
    pointer-events: none;
  }

  .btn-print {
    background: var(--gold);
    color: #000;
    border: none;
    border-radius: var(--radius);
    padding: 9px 18px;
    font-size: 13px; font-weight: 700;
    cursor: pointer;
    font-family: 'Plus Jakarta Sans', sans-serif;
    display: flex; align-items: center; gap: 6px;
    transition: opacity .2s;
  }

  .btn-print:hover { opacity: .85; }

  /* ── PENGAJAR MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 999;
    background: rgba(2,6,16,.72);
    display: none; align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    width: 100%; max-width: 480px;
    max-height: 80vh;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 50px rgba(0,0,0,.5);
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
  }
  .modal-head h3 {
    font-size: 16px; font-weight: 700; color: var(--text);
    display: flex; align-items: center; gap: 8px;
  }
  .modal-close {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    width: 30px; height: 30px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover { color: var(--text); border-color: var(--accent); }
  .modal-body {
    overflow-y: auto;
    padding: 10px 12px;
  }
  .pengajar-item {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
    padding: 11px 12px;
    border-radius: 8px;
    margin-bottom: 4px;
  }
  .pengajar-item:hover { background: var(--surface2); }
  .pengajar-info { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .pengajar-num {
    width: 26px; height: 26px; flex-shrink: 0;
    border-radius: 7px;
    background: linear-gradient(135deg, var(--gold), #d97706);
    color: #1a1206;
    font-size: 12px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  .pengajar-name {
    font-size: 14px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pengajar-count {
    font-size: 12px; color: var(--muted); flex-shrink: 0;
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 2px 9px; border-radius: 20px;
  }
  .stat-pill.clickable { cursor: pointer; transition: transform .15s, border-color .15s; }
  .stat-pill.clickable:hover { border-color: var(--gold); transform: translateY(-1px); }

  /* TABLE */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  thead th {
    background: var(--surface2);
    padding: 12px 16px;
    text-align: left;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .5px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background .15s;
  }

  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(37,99,235,.04); }

  tbody td {
    padding: 12px 16px;
    vertical-align: middle;
  }

  .no-badge {
    display: inline-flex;
    align-items: center; justify-content: center;
    width: 32px; height: 32px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; font-weight: 600;
    color: var(--accent);
  }

  .pengajar-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(37,99,235,.1);
    border: 1px solid rgba(37,99,235,.2);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 12px; font-weight: 600;
    color: #93C5FD;
    max-width: 200px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .materi-text {
    color: var(--text);
    font-size: 13px;
    line-height: 1.4;
    max-width: 280px;
  }

  .hal-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--gold);
    font-weight: 600;
  }

  /* QR CELL */
  .qr-cell {
    display: flex; flex-direction: column;
    align-items: center; gap: 6px;
  }

  .qr-box {
    background: #fff;
    border-radius: 6px;
    padding: 6px;
    display: inline-block;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
  }
  .qr-box:hover {
    transform: scale(1.06);
    box-shadow: 0 0 0 2px var(--gold);
  }

  .qr-box canvas, .qr-box img { display: block; }

  .qr-label {
    font-size: 10px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    text-align: center;
  }

  /* ── QR MODAL ── */
  .qr-modal-card { max-width: 360px; text-align: center; }
  .qr-modal-body {
    padding: 24px 24px 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .qr-modal-box {
    background: #fff;
    border-radius: 10px;
    padding: 14px;
    display: inline-block;
  }
  .qr-modal-box canvas, .qr-modal-box img { display: block; }
  .qr-modal-info { width: 100%; }
  .qr-modal-sesi {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--gold);
    font-weight: 700;
    letter-spacing: .5px;
    margin-bottom: 4px;
  }
  .qr-modal-pengajar {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
  }
  .qr-modal-materi {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
  }
  .btn-download-qr {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Plus Jakarta Sans', sans-serif;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-download-qr:hover { background: var(--accent2); }

  /* EMPTY / LOADING */
  .state-row td {
    padding: 40px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }

  .spinner {
    display: inline-block;
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* TANGGAL / JAM / AKSI */
  .tanggal-cell {
    font-size: 12.5px;
    color: var(--text);
    white-space: nowrap;
  }
  .tanggal-cell.empty { color: var(--muted); font-style: italic; }
  .jam-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    font-weight: 700;
    background: rgba(37,99,235,.1);
    border: 1px solid rgba(37,99,235,.2);
    border-radius: 6px;
    padding: 3px 8px;
    white-space: nowrap;
  }
  .btn-edit {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    width: 34px; height: 34px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .btn-edit:hover { border-color: var(--accent); color: var(--accent); background: rgba(37,99,235,.08); }

  /* EDIT MODAL FORM */
  .edit-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
  .edit-body .field { margin-bottom: 0; }
  .edit-body textarea {
    width: 100%;
    background: #0B1120;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 11px 14px;
    color: var(--text);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 14px;
    resize: vertical;
    outline: none;
    transition: border-color .2s;
  }
  .edit-body textarea:focus { border-color: var(--accent); }
  .edit-row-2 { display: flex; gap: 12px; }
  .edit-row-2 .field { flex: 1; }

  /* PRINT STYLES */
  @media print {
    body { background: #fff; color: #000; }
    .topbar, .toolbar, .stats-bar, .btn-print, .btn-logout { display: none !important; }
    #loginOverlay { display: none !important; }
    #app { display: block !important; }
    .content { padding: 10px; }
    .table-wrap { border: 1px solid #ccc; }
    thead th { background: #f0f0f0; color: #333; border-bottom: 1px solid #ccc; }
    tbody tr { border-bottom: 1px solid #eee; }
    .no-badge { background: #eee; color: #000; border: 1px solid #ccc; }
    .pengajar-chip { background: #e8f0fe; color: #1a56db; border: none; }
    .hal-badge { color: #b45309; }
    .qr-box { border: 1px solid #ccc; }
    .qr-label { color: #666; }
    .materi-text { color: #000; }
    .jam-badge { color: #1a56db; background: none; border: 1px solid #ccc; }
    table { font-size: 11px; }
    tbody td { padding: 8px 10px; }
    .no-print { display: none !important; }
    @page { margin: 15mm; size: A4 landscape; }
  }

  /* RESPONSIVE */
  @media (max-width: 640px) {
    .content { padding: 16px; }
    .topbar { padding: 0 16px; }
    .stat-pill { min-width: 100%; }
    .materi-text { max-width: 160px; font-size: 12px; }
    .pengajar-chip { max-width: 130px; font-size: 11px; }
  }
</style>
</head>
<body>

<!-- ═══════════════ LOGIN OVERLAY ═══════════════ -->
<div id="loginOverlay">
  <div class="login-card">
    <div class="login-logo">
      <div class="cross">✝</div>
      <h2>GBKP Ngawan</h2>
      <p>Jadwal Pengajar 2026/2027</p>
    </div>
    <div class="field">
      <label>Username</label>
      <input type="text" id="loginUser" placeholder="masukkan username" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div class="remember-row">
      <input type="checkbox" id="loginRemember">
      <label for="loginRemember">Ingat saya</label>
    </div>
    <button class="btn-login" id="btnLogin" onclick="doLogin()">Masuk</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- ═══════════════ MAIN APP ═══════════════ -->
<div id="app">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo">✝</div>
      <div>
        <div class="topbar-title">Jadwal Ngawan</div>
        <div class="topbar-sub">GBKP 2026/2027</div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="user-chip">
        <div class="user-avatar" id="userAvatar">?</div>
        <span id="userLabel">—</span>
      </div>
      <button class="btn-logout" onclick="doLogout()">Keluar</button>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <!-- STATS -->
    <div class="stats-bar">
      <div class="stat-pill">
        <div class="stat-icon blue">📋</div>
        <div>
          <div class="stat-val" id="statTotal">—</div>
          <div class="stat-lbl">Total Sesi</div>
        </div>
      </div>
      <div class="stat-pill clickable" id="statPengajarPill" onclick="openPengajarModal()">
        <div class="stat-icon gold">👨‍🏫</div>
        <div>
          <div class="stat-val" id="statPengajar">—</div>
          <div class="stat-lbl">Pengajar</div>
        </div>
      </div>
      <div class="stat-pill">
        <div class="stat-icon green">✅</div>
        <div>
          <div class="stat-val" id="statLoaded">—</div>
          <div class="stat-lbl">Data Termuat</div>
        </div>
      </div>
    </div>

    <!-- TOOLBAR -->
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Cari pengajar atau materi..." oninput="filterTable()">
      </div>
      <button class="btn-print" onclick="window.print()">🖨️ Print Semua QR</button>
    </div>

    <!-- TABLE -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:52px">No</th>
            <th>Pengajar</th>
            <th>Materi</th>
            <th style="width:70px">Hal.</th>
            <th style="width:130px">Tanggal</th>
            <th style="width:70px">Jam</th>
            <th class="no-print" style="width:56px; text-align:center">Aksi</th>
            <th style="width:110px; text-align:center">QR Absensi</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr class="state-row">
            <td colspan="8">
              <span class="spinner"></span> Memuat data dari server...
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div><!-- /content -->
</div><!-- /app -->

<!-- ═══════════════ MODAL PENGAJAR ═══════════════ -->
<div class="modal-overlay" id="pengajarModal" onclick="if(event.target===this) closePengajarModal()">
  <div class="modal-card">
    <div class="modal-head">
      <h3>👨‍🏫 Daftar Pengajar</h3>
      <button class="modal-close" onclick="closePengajarModal()">✕</button>
    </div>
    <div class="modal-body" id="pengajarModalBody"></div>
  </div>
</div>

<!-- ═══════════════ MODAL QR CODE ═══════════════ -->
<div class="modal-overlay" id="qrModal" onclick="if(event.target===this) closeQrModal()">
  <div class="modal-card qr-modal-card">
    <div class="modal-head">
      <h3>📷 QR Absensi</h3>
      <button class="modal-close" onclick="closeQrModal()">✕</button>
    </div>
    <div class="qr-modal-body">
      <div class="qr-modal-box" id="qrModalBox"></div>
      <div class="qr-modal-info">
        <div class="qr-modal-sesi" id="qrModalSesi">SESI —</div>
        <div class="qr-modal-pengajar" id="qrModalPengajar">—</div>
        <div class="qr-modal-materi" id="qrModalMateri">—</div>
      </div>
      <button class="btn-download-qr" id="btnDownloadQr">⬇️ Download QR Code</button>
    </div>
  </div>
</div>

<!-- ═══════════════ MODAL EDIT SESI ═══════════════ -->
<div class="modal-overlay" id="editModal" onclick="if(event.target===this) closeEditModal()">
  <div class="modal-card">
    <div class="modal-head">
      <h3>✏️ Edit Sesi <span id="editModalNo" style="color:var(--gold)"></span></h3>
      <button class="modal-close" onclick="closeEditModal()">✕</button>
    </div>
    <div class="edit-body">
      <div class="field">
        <label>Pengajar / Pembicara</label>
        <input type="text" id="editPengajar" placeholder="Nama pengajar">
      </div>
      <div class="field">
        <label>Materi</label>
        <textarea id="editMateri" rows="3" placeholder="Judul materi"></textarea>
      </div>
      <div class="edit-row-2">
        <div class="field">
          <label>Halaman</label>
          <input type="text" id="editHalaman" placeholder="cth. 11">
        </div>
        <div class="field">
          <label>Jam</label>
          <input type="time" id="editJam">
        </div>
      </div>
      <div class="field">
        <label>Tanggal</label>
        <input type="date" id="editTanggal">
      </div>
      <button class="btn-login" id="btnSaveEdit" onclick="saveEdit()">💾 Simpan Perubahan</button>
      <div class="login-err" id="editErr"></div>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// CONFIG
// ─────────────────────────────────────────────
const API_URL   = 'https://lidan-co-id.pages.dev/api/contacts_filter_dinamis6';
const AUTH_KEY  = 'admin';
const TABLE_DATA  = 'ngawan';
const TABLE_USERS = 'users';
const BASE_ABSENSI = 'https://gbkp.my.id/ngawan/absensi.html';
const SESSION_KEY  = 'ngawan_user';
const REMEMBER_KEY = 'ngawan_remember';

// ─────────────────────────────────────────────
// TANGGAL HELPERS (format "Hari, D Bulan YYYY" ala lampiran)
// ─────────────────────────────────────────────
const NAMA_HARI  = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const NAMA_BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

// 'YYYY-MM-DD' (dari <input type="date">) -> "Sabtu, 25 Juli 2026"
function formatTanggalIndo(isoDate) {
  if (!isoDate) return null;
  const d = new Date(isoDate + 'T00:00:00');
  if (isNaN(d.getTime())) return null;
  return `${NAMA_HARI[d.getDay()]}, ${d.getDate()} ${NAMA_BULAN[d.getMonth()]} ${d.getFullYear()}`;
}

// "Sabtu, 25 Juli 2026" -> 'YYYY-MM-DD' (untuk isi value <input type="date">)
function parseTanggalIndoToIso(str) {
  if (!str) return '';
  const m = str.match(/(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/);
  if (!m) return '';
  const [, day, monName, year] = m;
  const idx = NAMA_BULAN.findIndex(b => b.toLowerCase() === monName.toLowerCase());
  if (idx === -1) return '';
  return `${year}-${String(idx+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}

// ─────────────────────────────────────────────
// SESSION
// ─────────────────────────────────────────────
function getSession() {
  try {
    return JSON.parse(sessionStorage.getItem(SESSION_KEY)) ||
           JSON.parse(localStorage.getItem(SESSION_KEY));
  } catch { return null; }
}
function setSession(u, remember) {
  if (remember) {
    localStorage.setItem(SESSION_KEY, JSON.stringify(u));
    localStorage.setItem(REMEMBER_KEY, '1');
    sessionStorage.removeItem(SESSION_KEY);
  } else {
    sessionStorage.setItem(SESSION_KEY, JSON.stringify(u));
    localStorage.removeItem(SESSION_KEY);
    localStorage.removeItem(REMEMBER_KEY);
  }
}
function clearSession() {
  sessionStorage.removeItem(SESSION_KEY);
  localStorage.removeItem(SESSION_KEY);
  localStorage.removeItem(REMEMBER_KEY);
}

// ─────────────────────────────────────────────
// BOOT
// ─────────────────────────────────────────────
(function boot() {
  const s = getSession();
  if (s) showApp(s);
  // else login overlay already visible

  // restore remember-me checkbox state
  if (localStorage.getItem(REMEMBER_KEY) === '1') {
    document.getElementById('loginRemember').checked = true;
  }

  // Enter key on login
  ['loginUser','loginPass'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
  });
})();

// ─────────────────────────────────────────────
// LOGIN
// ─────────────────────────────────────────────
async function doLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value.trim();
  const errEl    = document.getElementById('loginErr');
  const btnEl    = document.getElementById('btnLogin');

  if (!username || !password) {
    showErr('Username dan password wajib diisi.');
    return;
  }

  btnEl.disabled = true;
  btnEl.textContent = 'Memeriksa...';
  errEl.style.display = 'none';

  try {
    const resp = await fetch(
      `${API_URL}?table=${TABLE_USERS}&action=login`,
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Custom-Auth': AUTH_KEY,
          'X-Role': 'user'
        },
        body: JSON.stringify({ username, password })
      }
    );

    const json = await resp.json();

    if (json.success) {
      const userData = { username, display: json.data?.x_01 || username };
      const remember = document.getElementById('loginRemember').checked;
      setSession(userData, remember);
      showApp(userData);
    } else {
      showErr(json.message || 'Username atau password salah.');
    }
  } catch (e) {
    showErr('Gagal terhubung ke server. Periksa koneksi internet.');
  } finally {
    btnEl.disabled = false;
    btnEl.textContent = 'Masuk';
  }
}

function showErr(msg) {
  const el = document.getElementById('loginErr');
  el.textContent = msg;
  el.style.display = 'block';
}

function doLogout() {
  clearSession();
  location.reload();
}

// ─────────────────────────────────────────────
// SHOW APP
// ─────────────────────────────────────────────
function showApp(user) {
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('userLabel').textContent = user.display || user.username;
  document.getElementById('userAvatar').textContent =
    (user.display || user.username).charAt(0).toUpperCase();
  loadData();
}

// ─────────────────────────────────────────────
// LOAD DATA
// ─────────────────────────────────────────────
let ALL_ROWS = [];

async function loadData() {
  try {
    const resp = await fetch(
      `${API_URL}?table=${TABLE_DATA}&limit=100&offset=0`,
      { headers: { 'X-Custom-Auth': AUTH_KEY } }
    );
    const json = await resp.json();

    if (!json.success) throw new Error(json.error || 'Gagal memuat data');

    // Sort by x_01 (nomor urut)
    ALL_ROWS = (json.data || []).sort((a, b) => {
      return parseInt(a.x_01 || 0) - parseInt(b.x_01 || 0);
    });

    updateStats(ALL_ROWS);
    renderTable(ALL_ROWS);
  } catch (e) {
    document.getElementById('tableBody').innerHTML = `
      <tr class="state-row">
        <td colspan="8">⚠️ Gagal memuat data: ${e.message}</td>
      </tr>`;
  }
}

// ─────────────────────────────────────────────
// STATS
// ─────────────────────────────────────────────
// Hanya hitung pengajar dengan gelar Pdt, Pt, atau Dk di awal nama
function isPengajarValid(nama) {
  return /^(pdt|pt|dk)\b\.?\s*/i.test((nama || '').trim());
}

function updateStats(rows) {
  const pengajarSet = new Set(
    rows.map(r => (r.x_02 || '').trim()).filter(isPengajarValid)
  );
  document.getElementById('statTotal').textContent    = rows.length;
  document.getElementById('statPengajar').textContent = pengajarSet.size;
  document.getElementById('statLoaded').textContent   = rows.length;
}

// ─────────────────────────────────────────────
// MODAL PENGAJAR
// ─────────────────────────────────────────────
function openPengajarModal() {
  // Hitung jumlah sesi per pengajar (hanya Pdt/Pt/Dk), urut alfabetis
  const counts = {};
  ALL_ROWS.forEach(r => {
    const nama = (r.x_02 || '').trim();
    if (!nama || !isPengajarValid(nama)) return;
    counts[nama] = (counts[nama] || 0) + 1;
  });

  const names = Object.keys(counts).sort((a, b) => a.localeCompare(b, 'id'));
  const body  = document.getElementById('pengajarModalBody');

  if (names.length === 0) {
    body.innerHTML = `<div class="pengajar-item">Belum ada data pengajar.</div>`;
  } else {
    body.innerHTML = names.map((nama, i) => `
      <div class="pengajar-item">
        <div class="pengajar-info">
          <div class="pengajar-num">${i + 1}</div>
          <div class="pengajar-name" title="${nama}">${nama}</div>
        </div>
        <div class="pengajar-count">${counts[nama]} sesi</div>
      </div>
    `).join('');
  }

  document.getElementById('pengajarModal').classList.add('show');
}

function closePengajarModal() {
  document.getElementById('pengajarModal').classList.remove('show');
}

// ─────────────────────────────────────────────
// MODAL QR CODE
// ─────────────────────────────────────────────
function openQrModal(id_x) {
  const row = ALL_ROWS.find(r => String(r.id_x) === String(id_x));
  if (!row) return;

  const no       = row.x_01 || '—';
  const pengajar = row.x_02 || '—';
  const materi   = row.x_03 || '—';
  const qrUrl    = `${BASE_ABSENSI}?sesi=${no}&id=${id_x}`;

  document.getElementById('qrModalSesi').textContent     = `SESI ${no}`;
  document.getElementById('qrModalPengajar').textContent = pengajar;
  document.getElementById('qrModalMateri').textContent   = materi;

  const box = document.getElementById('qrModalBox');
  box.innerHTML = '';

  new QRCode(box, {
    text: qrUrl,
    width: 240,
    height: 240,
    colorDark: '#000000',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });

  document.getElementById('qrModal').classList.add('show');

  // Setup tombol download (tunggu QR selesai dirender)
  requestAnimationFrame(() => {
    const btn = document.getElementById('btnDownloadQr');
    btn.onclick = () => downloadQr(box, no, pengajar);
  });
}

function closeQrModal() {
  document.getElementById('qrModal').classList.remove('show');
}

function downloadQr(box, no, pengajar) {
  const canvas = box.querySelector('canvas');
  const img    = box.querySelector('img');
  const safeName = (pengajar || 'pengajar').replace(/[^a-zA-Z0-9]+/g, '_');
  const filename = `QR_Sesi${no}_${safeName}.png`;

  const triggerDownload = (dataUrl) => {
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
  };

  if (canvas) {
    triggerDownload(canvas.toDataURL('image/png'));
  } else if (img) {
    triggerDownload(img.src);
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closePengajarModal(); closeQrModal(); closeEditModal(); }
});

// ─────────────────────────────────────────────
// EDIT SESI (pengajar / materi / halaman / tanggal / jam)
// ─────────────────────────────────────────────
async function apiPut(table, id_x, body) {
  const r = await fetch(`${API_URL}?table=${table}&id_x=${encodeURIComponent(id_x)}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'X-Custom-Auth': AUTH_KEY },
    body: JSON.stringify(body)
  });
  return r.json();
}

let _editRow = null;

function openEditModal(id_x) {
  const row = ALL_ROWS.find(r => String(r.id_x) === String(id_x));
  if (!row) return;
  _editRow = row;

  document.getElementById('editModalNo').textContent = 'No. ' + (row.x_01 || '—');
  document.getElementById('editPengajar').value = row.x_02 || '';
  document.getElementById('editMateri').value   = row.x_03 || '';
  document.getElementById('editHalaman').value  = row.x_04 || '';
  document.getElementById('editTanggal').value  = parseTanggalIndoToIso(row.x_06);
  document.getElementById('editJam').value      = row.x_07 || '';

  const errEl = document.getElementById('editErr');
  errEl.style.display = 'none';
  errEl.textContent = '';

  document.getElementById('editModal').classList.add('show');
}

function closeEditModal() {
  document.getElementById('editModal').classList.remove('show');
  _editRow = null;
}

async function saveEdit() {
  if (!_editRow) return;

  const btn   = document.getElementById('btnSaveEdit');
  const errEl = document.getElementById('editErr');
  errEl.style.display = 'none';

  const pengajar  = document.getElementById('editPengajar').value.trim();
  const materi    = document.getElementById('editMateri').value.trim();
  const halaman   = document.getElementById('editHalaman').value.trim();
  const isoTgl    = document.getElementById('editTanggal').value;
  const jam       = document.getElementById('editJam').value.trim();

  if (!pengajar) { errEl.textContent = 'Nama pengajar wajib diisi.'; errEl.style.display = 'block'; return; }

  // Kalau tanggal tidak diubah (input date dikosongkan), pertahankan nilai lama
  const tanggal = isoTgl ? formatTanggalIndo(isoTgl) : (_editRow.x_06 || null);

  btn.disabled = true; btn.textContent = 'Menyimpan...';

  try {
    const res = await apiPut(TABLE_DATA, _editRow.id_x, {
      x_02: pengajar,
      x_03: materi,
      x_04: halaman,
      x_06: tanggal,
      x_07: jam || null
    });

    if (res.success) {
      Object.assign(_editRow, {
        x_02: pengajar, x_03: materi, x_04: halaman, x_06: tanggal, x_07: jam || null
      });
      updateStats(ALL_ROWS);
      filterTable(); // re-render dengan filter pencarian yang sedang aktif
      closeEditModal();
    } else {
      errEl.textContent = res.error || 'Gagal menyimpan perubahan.';
      errEl.style.display = 'block';
    }
  } catch (e) {
    errEl.textContent = 'Gagal terhubung ke server.';
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = '💾 Simpan Perubahan';
  }
}

// ─────────────────────────────────────────────
// FILTER
// ─────────────────────────────────────────────
function filterTable() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = q
    ? ALL_ROWS.filter(r =>
        (r.x_02 || '').toLowerCase().includes(q) ||
        (r.x_03 || '').toLowerCase().includes(q)
      )
    : ALL_ROWS;
  renderTable(filtered);
}

// ─────────────────────────────────────────────
// RENDER TABLE
// ─────────────────────────────────────────────
function renderTable(rows) {
  const tbody = document.getElementById('tableBody');

  if (rows.length === 0) {
    tbody.innerHTML = `
      <tr class="state-row">
        <td colspan="8">Tidak ada data yang cocok.</td>
      </tr>`;
    return;
  }

  tbody.innerHTML = '';

  rows.forEach(row => {
    const id_x  = row.id_x;
    const no    = row.x_01 || '—';
    const pengajar = row.x_02 || '—';
    const materi   = row.x_03 || '';
    const hal      = row.x_04 || '';
    const tanggal  = row.x_06 || '';
    const jam      = row.x_07 || '';

    const qrUrl = `${BASE_ABSENSI}?sesi=${no}&id=${id_x}`;

    const tr = document.createElement('tr');
    tr.dataset.pengajar = pengajar.toLowerCase();
    tr.dataset.materi   = materi.toLowerCase();

    tr.innerHTML = `
      <td><span class="no-badge">${no}</span></td>
      <td><span class="pengajar-chip" title="${pengajar}">👤 ${pengajar}</span></td>
      <td><div class="materi-text">${materi || '<span style="color:var(--muted)">—</span>'}</div></td>
      <td><span class="hal-badge">${hal ? 'hlm. ' + hal : '—'}</span></td>
      <td><span class="tanggal-cell ${tanggal ? '' : 'empty'}">${tanggal || 'belum diisi'}</span></td>
      <td>${jam ? `<span class="jam-badge">${jam}</span>` : '<span style="color:var(--muted)">—</span>'}</td>
      <td class="no-print" style="text-align:center">
        <button class="btn-edit" title="Edit sesi" onclick="openEditModal('${id_x}')">✏️</button>
      </td>
      <td>
        <div class="qr-cell">
          <div class="qr-box" id="qr-${id_x}" onclick="openQrModal('${id_x}')"></div>
          <div class="qr-label">Sesi ${no}</div>
        </div>
      </td>
    `;

    tbody.appendChild(tr);

    // Generate QR setelah row masuk DOM
    requestAnimationFrame(() => {
      try {
        new QRCode(document.getElementById(`qr-${id_x}`), {
          text: qrUrl,
          width: 80,
          height: 80,
          colorDark: '#000000',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.M
        });
      } catch (e) {
        document.getElementById(`qr-${id_x}`).innerHTML =
          `<div style="width:80px;height:80px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#ef4444">QR Error</div>`;
      }
    });
  });
}
</script>
</body>
</html>
